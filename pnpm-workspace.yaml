packages:
  - "server"
  - "cli"
  - "desktop"
  - "web"
allowBuilds:
  electron: true
  esbuild: true
onlyBuiltDependencies:
  - esbuild
  - electron
# Refuse versions younger than 3 days when resolving (minutes). Guards against freshly
# published worm releases; a sole-fix newer version must be pinned deliberately.
minimumReleaseAge: 4320
overrides:
  fast-uri: ^3.1.8
  find-my-way: ^9.6.1
  "js-yaml@>=4.0.0 <4.3.2": ^4.3.2
  "brace-expansion@>=4.0.0 <5.0.12": ^5.0.12
